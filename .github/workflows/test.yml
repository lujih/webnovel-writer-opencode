name: Test

# 独立于 manifest 门禁：manifest 走 contents:write 且只在 .opencode/** 变更时触发，
# 测试必须在 PR 与所有相关路径上跑，且用最小权限（只需读）。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .opencode/scripts/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r .opencode/scripts/requirements-dev.txt

      # pytest.ini 的 addopts 含 -p no:asyncio，会禁掉 pytest-asyncio 并让
      # test_rag_adapter.py 的 11 个 async 用例收集失败，故必须 -o "addopts="。
      # 无任何 --ignore：整个套件必须全绿（含 publisher 子系统）。
      - name: Run test suite
        run: |
          python -X utf8 -m pytest .opencode/scripts/data_modules/tests \
            -q -p no:cov -o "addopts="

      # AGENTS.md 是 CLAUDE.md 的派生成物：OpenCode V2 只发现 AGENTS.md，
      # 两者不同步则整套项目说明对模型不可见。--check 在漂移时返回 1。
      - name: Verify AGENTS.md mirror is in sync
        run: python -X utf8 .opencode/scripts/webnovel.py sync-agents-md --check

      - name: Byte-compile all scripts
        run: python -m compileall -q .opencode/scripts

  # 前端此前零 CI：dist 提交进 git 但没有人在 CI 里验证它**能构建出来**，
  # 于是跨平台 node_modules（只含 win32 rollup 包）这类问题长期不可见。
  # 这里独立成一个 job：Python 侧的失败不该掩盖前端失败，反之亦然。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode/dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .opencode/dashboard/frontend/package-lock.json

      # npm ci 而不是 npm install：按 lock 文件精确安装，顺带证明
      # package-lock.json 与 package.json 没有脱节（install 会"顺手修好"）。
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # dist 是提交进 git 的（npm 离线包要带上它）。构建后若无差异，
      # 说明仓库里的产物与源码同步；有差异说明有人改了 src 忘了重建。
      # 只警告不失败——构建产物含 hash 文件名的差异噪音较大，
      # 强门禁会让正常 PR 频繁变红，但至少要让人看见。
      - name: Warn if committed dist is stale
        working-directory: .
        run: |
          if ! git diff --quiet -- .opencode/dashboard/frontend/dist; then
            echo "::warning::committed dist/ differs from a fresh build — 前端源码改了但没重建产物"
            git diff --stat -- .opencode/dashboard/frontend/dist | tail -20
          fi

