name: npm-package

on:
  push:
    branches: [master]
    paths:
      - '.npm-package/**'
      - '.opencode/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到 npm'
        type: boolean
        default: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .npm-package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 构建离线包
        run: node scripts/build-bundle.js

      - name: 验证提取
        run: node scripts/verify-bundle.js

      - name: 同步 tag 版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: npm pack (验证)
        run: npm pack

      - name: npm publish (tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: npm publish (手动触发)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
