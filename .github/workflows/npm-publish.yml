name: npm-publish

on:
  push:
    branches: [master]
    paths:
      - '.npm-package/**'
      - '.opencode/**'
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .npm-package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 构建离线包
        run: node scripts/build-bundle.js

      - name: 验证
        run: node scripts/verify-bundle.js

      - name: 确定版本号
        run: |
          PKG="@cszx/webnovel-writer-opencode"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # tag 推送: 直接用 tag 版本
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          else
            # 普通推送: 基于最新 tag 自动 bump prerelease
            BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
            BASE_TAG="${BASE_TAG:-0.0.0}"

            # 查 npm 当前最新版本
            NPM_LATEST=$(npm view "$PKG" version 2>/dev/null || echo "$BASE_TAG")

            if [[ "$NPM_LATEST" == "$BASE_TAG" ]]; then
              VER="${BASE_TAG}-1"
            elif [[ "$NPM_LATEST" == ${BASE_TAG}-* ]]; then
              N=$(echo "$NPM_LATEST" | sed "s/${BASE_TAG}-//")
              VER="${BASE_TAG}-$((N + 1))"
            else
              VER="${BASE_TAG}-1"
            fi
          fi

          echo "版本: $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag latest

      - name: 生成 Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .npm-package/cszx-webnovel-writer-opencode-*.tgz
