name: npm-publish

on:
  push:
    branches: [master]
    paths:
      - '.npm-package/**'
      - '.opencode/**'
    tags:
      - 'v*'
  # 凭据轮换后需要一个主动重发的入口：只有 push 触发的话，修了 token 也只能
  # 靠制造空提交来触发，那类提交会污染 master 历史。
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing（OIDC）：用 GitHub 的短期身份令牌换取 npm 发布凭证。
      # 不再需要长期 npm 令牌——它会过期/泄露，而令牌过期正是本
      # workflow 连续失败两周无人察觉的根因。
      id-token: write
    defaults:
      run:
        working-directory: .npm-package
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # OIDC 令牌交换是 npm CLI **11.5.1** 才引入的，而 node 22 自带的是
      # 10.9.9 —— 不升级的话 npm 认不出 OIDC，会退回去找令牌然后报 E401/EOTP。
      # 必须升到 11.5.1 以上（当前 npm 12.x）。
      - name: 升级 npm 以支持 Trusted Publishing
        run: npm install -g npm@latest && npm --version

      - name: 构建离线包
        run: node scripts/build-bundle.js

      - name: 验证
        run: node scripts/verify-bundle.js

      - name: 确定版本号
        run: |
          set -euo pipefail
          PKG="@cszx/webnovel-writer-opencode"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # tag 推送: 直接用 tag 版本
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          else
            # 普通推送: 基于最新 tag 自动 bump prerelease
            BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
            BASE_TAG="${BASE_TAG:-0.0.0}"

            # ⚠️ `npm view` 失败时**不能**回落到 "$BASE_TAG"。回落会算出
            # "${BASE_TAG}-1"，而那个版本（2.9.2-1）早在 2026-06 就发布过，
            # 于是每次都撞 EPUBLISHCONFLICT，且报错与真实原因（registry 查询失败）
            # 毫无关联。查不到就明确失败——这一步失败才是可诊断的。
            if ! NPM_LATEST=$(npm view "$PKG" version 2>/dev/null); then
              echo "::error::无法查询 npm 上 ${PKG} 的最新版本（registry 不可达或包名有误）。" >&2
              echo "::error::为避免算出已发布过的 ${BASE_TAG}-1 并触发 EPUBLISHCONFLICT，此处中止。" >&2
              exit 1
            fi

            if [[ -z "$NPM_LATEST" ]]; then
              echo "::error::npm view 返回空版本号，中止。" >&2
              exit 1
            fi

            if [[ "$NPM_LATEST" == "$BASE_TAG" ]]; then
              VER="${BASE_TAG}-1"
            elif [[ "$NPM_LATEST" == ${BASE_TAG}-* ]]; then
              N=$(echo "$NPM_LATEST" | sed "s/${BASE_TAG}-//")
              VER="${BASE_TAG}-$((N + 1))"
            else
              echo "::error::npm 上最新版本 ${NPM_LATEST} 与最新 git tag ${BASE_TAG} 不在同一 base，" >&2
              echo "::error::自动 bump 无从判断，请人工发 tag（v${BASE_TAG}）后再发布。" >&2
              exit 1
            fi
          fi

          # 算出来的版本是否已被占用——早失败并说人话，而不是让 npm 抛
          # EPUBLISHCONFLICT。
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::error::版本 ${VER} 已存在于 npm。请人工确认要发的新版本号。" >&2
            exit 1
          fi

          echo "版本: $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version

      # 不再注入 npm 认证令牌：Trusted Publishing 由 npm CLI 自动发现
      # Actions 的 OIDC 环境变量并换取短期凭证。显式带令牌反而会让 npm
      # 优先走令牌路径，而账号若强制 2FA 就又回到 EOTP。
      - name: npm publish（Trusted Publishing / OIDC）
        run: |
          set -euo pipefail
          # 发布是**对外不可逆**的动作：一次失败只说明这次没成，但根因常被
          # 后续推送淹没。此处在失败时打醒目日志并回传 GitHub 注解，
          # 免得又出现"连续失败两周没人发现"。
          if ! npm publish --access public --tag latest --provenance; then
            echo "::error::npm publish 失败。Trusted Publishing 下的常见根因：" >&2
            echo "::error::  1) npm 包未配置 Trusted Publisher，或仓库/工作流名/环境对不上；" >&2
            echo "::error::  2) workflow 缺少 permissions.id-token: write；" >&2
            echo "::error::  3) npm CLI < 11.5.1，认不出 OIDC（本 workflow 会先自升级）。" >&2
            echo "::error::修复后重跑本 workflow 即可；已发布的版本不受影响。" >&2
            exit 1
          fi

      - name: 生成 Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .npm-package/cszx-webnovel-writer-opencode-*.tgz
